        - desired_state
        - lifecycle_status
        - status
        - wake_requested
      type: object
    WorkspaceListItem:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        desired_state:
          enum:
            - active
            - inactive
            - destroyed
          type: string
        memory_mib:
          description: Memory in MiB.
          format: int64
          type: integer
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        storage_gib:
          format: int64
          type: integer
        vcpu:
          description: CPU in vCPUs.
          format: double
          type: number
        workspace_id:
          type: string
      required:
