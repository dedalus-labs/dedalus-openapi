components:
  schemas:
    ArtifactListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ArtifactResponse"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ArtifactRef:
      additionalProperties: false
      properties:
        artifact_id:
          type: string
        name:
          type: string
      required:
        - artifact_id
        - name
      type: object
    ArtifactResponse:
      additionalProperties: false
      properties:
        artifact_id:
          type: string
        created_at:
          format: date-time
          type: string
        download_url:
          type: string
        execution_id:
          type: string
        expires_at:
          format: date-time
          type: string
        mime_type:
          type: string
        name:
          type: string
        sha256:
          type: string
        size_bytes:
          format: int64
          type: integer
        workspace_id:
          type: string
      required:
        - artifact_id
        - workspace_id
        - name
        - size_bytes
        - created_at
      type: object
    CreateExecutionRequest:
      additionalProperties: false
      properties:
        command:
          items:
            type: string
          type:
            - array
            - "null"
        cwd:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        stdin:
          type: string
        timeout_ms:
          format: int64
          type: integer
        wake_if_needed:
          type: boolean
      required:
        - command
      type: object
    CreatePreviewRequest:
      additionalProperties: false
      properties:
        port:
          format: int64
          type: integer
        protocol:
          enum:
            - http
            - https
          type: string
        wake_if_needed:
          type: boolean
      required:
        - port
      type: object
    CreateSSHSessionRequest:
      additionalProperties: false
      properties:
        public_key:
          type: string
        wake_if_needed:
          type: boolean
      required:
        - public_key
      type: object
    CreateTerminalRequest:
      additionalProperties: false
      properties:
        cwd:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        height:
          format: int64
          type: integer
        shell:
          type: string
        wake_if_needed:
          type: boolean
        width:
          format: int64
          type: integer
      required:
        - width
        - height
      type: object
    CreateWorkspaceRequest:
      additionalProperties: false
      properties:
        memory_mib:
          description: Memory in MiB.
          format: int64
          type: integer
        storage_gib:
          format: int64
          type: integer
        vcpu:
          description: CPU in vCPUs.
          format: double
          type: number
      required:
        - vcpu
        - memory_mib
        - storage_gib
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExecutionEvent:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        chunk:
          type: string
        error_code:
          type: string
        error_message:
          type: string
        exit_code:
          format: int64
          type: integer
        sequence:
          format: int64
          type: integer
        signal:
          format: int64
          type: integer
        status:
          enum:
            - wake_in_progress
            - queued
            - running
            - succeeded
            - failed
            - cancelled
            - expired
          type: string
        type:
          enum:
            - lifecycle
            - stdout
            - stderr
          type: string
      required:
        - sequence
        - type
        - at
      type: object
    ExecutionEventsResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ExecutionEvent"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ExecutionListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ExecutionResponse"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    ExecutionOutputResponse:
      additionalProperties: false
      properties:
        execution_id:
          type: string
        stderr:
          type: string
        stderr_bytes:
          format: int64
          type: integer
        stderr_truncated:
          type: boolean
        stdout:
          type: string
        stdout_bytes:
          format: int64
          type: integer
        stdout_truncated:
          type: boolean
      required:
        - execution_id
      type: object
    ExecutionResponse:
      additionalProperties: false
      properties:
        artifacts:
          items:
            $ref: "#/components/schemas/ArtifactRef"
          type:
            - array
            - "null"
        command:
          items:
            type: string
          type:
            - array
            - "null"
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        cwd:
          type: string
        env_keys:
          items:
            type: string
          type:
            - array
            - "null"
        error_code:
          type: string
        error_message:
          type: string
        execution_id:
          type: string
        exit_code:
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        retry_after_ms:
          format: int64
          type: integer
        signal:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        status:
          enum:
            - wake_in_progress
            - queued
            - running
            - succeeded
            - failed
            - cancelled
            - expired
          type: string
        stderr_bytes:
          format: int64
          type: integer
        stderr_truncated:
          type: boolean
        stdout_bytes:
          format: int64
          type: integer
        stdout_truncated:
          type: boolean
        workspace_id:
          type: string
      required:
        - execution_id
        - workspace_id
        - status
        - command
        - created_at
      type: object
    LifecycleResponse:
      additionalProperties: false
      properties:
        desired_state:
          enum:
            - active
            - inactive
            - destroyed
          type: string
        memory_mib:
          description: Memory in MiB.
          format: int64
          type: integer
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        storage_gib:
          format: int64
          type: integer
        vcpu:
          description: CPU in vCPUs.
          format: double
          type: number
        workspace_id:
          type: string
      required:
        - workspace_id
        - vcpu
        - memory_mib
        - storage_gib
        - desired_state
        - status
      type: object
    LifecycleStatus:
      additionalProperties: false
      properties:
        last_error:
