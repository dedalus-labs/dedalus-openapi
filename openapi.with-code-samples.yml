        operation_id:
          type: string
        requested_size_gib:
          format: int64
          type: integer
        result_size_gib:
          format: int64
          type: integer
        retryable_error:
          type: boolean
        snapshot_id:
          type: string
        snapshot_state:
          type: string
        state:
          enum:
            - in_progress
            - succeeded
            - failed
          type: string
        type:
          enum:
            - resize
            - snapshot
            - split
          type: string
        updated_at:
