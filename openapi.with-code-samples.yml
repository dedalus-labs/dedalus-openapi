          type: string
        error_code:
          type: string
        error_message:
          type: string
        expires_at:
          format: date-time
          type: string
        ready_at:
          format: date-time
          type: string
        retry_after_ms:
          format: int64
          type: integer
        session_id:
          type: string
        status:
