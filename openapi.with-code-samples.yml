      type: object
    TerminalServerEvent:
      discriminator:
        mapping:
          closed: "#/components/schemas/TerminalClosedEvent"
          error: "#/components/schemas/TerminalErrorEvent"
          output: "#/components/schemas/TerminalOutputEvent"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/TerminalOutputEvent"
        - $ref: "#/components/schemas/TerminalErrorEvent"
        - $ref: "#/components/schemas/TerminalClosedEvent"
    UpdateWorkspaceRequest:
      additionalProperties: false
      properties:
        memory_mib:
          description: Memory in MiB.
          format: int64
          type: integer
        storage_gib:
          format: int64
          type: integer
        vcpu:
          description: CPU in vCPUs.
          format: double
          type: number
      type: object
    WakeAdmissionResponse:
      additionalProperties: false
