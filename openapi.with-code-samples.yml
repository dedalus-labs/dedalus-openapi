    TerminalInputEvent:
      additionalProperties: false
      properties:
        data:
          description: Base64-encoded terminal input.
          format: byte
          type: string
        type:
          enum:
            - input
          type: string
      required:
        - type
        - data
      type: object
    TerminalListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/TerminalResponse"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    TerminalOutputEvent:
      additionalProperties: false
      properties:
        data:
          description: Base64-encoded terminal output.
          format: byte
          type: string
        type:
          enum:
            - output
          type: string
      required:
        - type
        - data
      type: object
    TerminalResizeEvent:
      additionalProperties: false
      properties:
        height:
          format: int64
          type: integer
        type:
          enum:
            - resize
          type: string
        width:
          format: int64
          type: integer
      required:
        - type
        - width
        - height
      type: object
    TerminalResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        error_code:
          type: string
        error_message:
          type: string
        expires_at:
          format: date-time
          type: string
        height:
          format: int64
          type: integer
        protocol:
          enum:
            - websocket
          type: string
        ready_at:
          format: date-time
          type: string
        retry_after_ms:
          format: int64
          type: integer
        status:
          enum:
            - wake_in_progress
            - ready
            - closed
            - expired
            - failed
          type: string
        stream_url:
          type: string
        terminal_id:
          type: string
        width:
