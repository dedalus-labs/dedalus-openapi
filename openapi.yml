components:
  schemas:
    CreateWorkspaceRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://dcs.dedaluslabs.ai/CreateWorkspaceRequest.json
          format: uri
          readOnly: true
          type: string
        cpus:
          format: int64
          type: integer
        image_version:
          type: string
        memory_mib:
          format: int64
          type: integer
        storage_gib:
          format: int64
          type: integer
      required:
        - cpus
        - memory_mib
        - storage_gib
        - image_version
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://dcs.dedaluslabs.ai/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LifecycleResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://dcs.dedaluslabs.ai/LifecycleResponse.json
          format: uri
          readOnly: true
          type: string
        desired_state:
          enum:
            - active
            - inactive
            - destroyed
          type: string
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        workspace_id:
          type: string
      required:
        - workspace_id
        - desired_state
        - status
      type: object
    LifecycleStatus:
      additionalProperties: false
      properties:
        assigned_host:
          type: string
        last_error:
          type: string
        last_progress_at:
          format: date-time
          type: string
        last_transition_at:
          format: date-time
          type: string
        observed_revision:
          type: string
        phase:
          enum:
            - accepted
            - placement_pending
            - starting
            - running
            - stopping
            - sleeping
            - destroying
            - destroyed
            - failed
          type: string
        reason:
          type: string
        retryable:
          type: boolean
        revision:
          type: string
      required:
        - phase
        - reason
        - retryable
        - revision
        - observed_revision
        - last_transition_at
        - last_progress_at
      type: object
    PurgeWorkspaceOutputBody:
      additionalProperties: false
      properties:
        purge_state:
          type: string
        workspace_id:
          type: string
      required:
        - workspace_id
        - purge_state
      type: object
    StorageOperationResponse:
      additionalProperties: false
      properties:
        error_code:
          type: string
        error_message:
          type: string
        operation_id:
          type: string
        requested_size_gib:
          format: int64
          type: integer
        result_size_gib:
          format: int64
          type: integer
        retryable_error:
          type: boolean
        snapshot_id:
          type: string
        snapshot_state:
          type: string
        state:
          enum:
            - in_progress
            - succeeded
            - failed
          type: string
        type:
          enum:
            - resize
            - snapshot
            - split
          type: string
        updated_at:
          format: date-time
          type: string
        workspace_id:
          type: string
      required:
        - operation_id
        - workspace_id
        - type
        - state
        - updated_at
      type: object
    UpdateWorkspaceRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://dcs.dedaluslabs.ai/UpdateWorkspaceRequest.json
          format: uri
          readOnly: true
          type: string
        cpus:
          format: int64
          type: integer
        memory_mib:
          format: int64
          type: integer
        storage_gib:
          format: int64
          type: integer
      type: object
    WakeAdmissionResponse:
      additionalProperties: false
      properties:
        desired_state:
          enum:
            - active
            - inactive
            - destroyed
          type: string
        lifecycle_status:
          $ref: "#/components/schemas/LifecycleStatus"
        retry_after_ms:
          format: int64
          type: integer
        status:
          enum:
            - proxy_ready
            - wake_in_progress
          type: string
        wake_requested:
          type: boolean
        workspace_id:
          type: string
      required:
        - workspace_id
        - desired_state
        - lifecycle_status
        - status
        - wake_requested
      type: object
    WorkspaceListItem:
      additionalProperties: false
      properties:
        cpus:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        desired_state:
          enum:
            - active
            - inactive
            - destroyed
          type: string
        image_version:
          type: string
        memory_mib:
          format: int64
          type: integer
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        storage_gib:
          format: int64
          type: integer
        workspace_id:
          type: string
      required:
        - workspace_id
        - cpus
        - memory_mib
        - storage_gib
        - desired_state
        - status
        - created_at
      type: object
    WorkspaceListResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://dcs.dedaluslabs.ai/WorkspaceListResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/WorkspaceListItem"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Dedalus API key. Alternative to Bearer token.
      in: header
      name: x-api-key
      type: apiKey
    BearerAuth:
      bearerFormat: Dedalus API key
      description: "Dedalus API key in Authorization: Bearer <key>."
      scheme: bearer
      type: http
info:
  description: Controlplane API for Dedalus Cloud Services (DCS).
  title: Dedalus Cloud Services API
  version: v1
openapi: 3.1.0
paths:
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      parameters:
        - in: header
          name: X-Dedalus-Org-Id
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
          description: OK
        "401":
          content:
            application/json:
              examples:
                invalid_key:
                  value:
                    error_code: AUTH_INVALID
                    message: invalid Dedalus API key
                    retryable: false
                missing_key:
                  value:
                    error_code: AUTH_REQUIRED
                    message: missing Dedalus API key
                    retryable: false
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                  - error_code
                  - message
                  - retryable
                type: object
          description: Authentication required
        "403":
          content:
            application/json:
              examples:
                org_mismatch:
                  value:
                    error_code: AUTH_ORG_MISMATCH
                    message: org scope does not match API key ownership
                    retryable: false
                scope_forbidden:
                  value:
                    error_code: AUTH_SCOPE_FORBIDDEN
                    message: internal service authorization is required
                    retryable: false
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                  - error_code
                  - message
                  - retryable
                type: object
          description: Forbidden
        "429":
          content:
            application/json:
              examples:
                idempotency_in_flight:
                  value:
                    error_code: RATE_LIMITED
                    message: idempotency key is already in-flight
                    retryable: true
                    retry_after_ms: 250
                mutation_rate_limited:
                  value:
                    error_code: RATE_LIMITED
                    message: mutation rate limit exceeded
                    retryable: true
                    retry_after_ms: 84
                    details:
                      rate_limit_scope: read_lifecycle_routes
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                  - error_code
                  - message
                  - retryable
                type: object
          description: Rate limited
        "503":
          content:
            application/json:
              examples:
                mutation_limiter_unavailable:
                  value:
                    error_code: DEPENDENCY_UNAVAILABLE
                    message: mutation rate limiter unavailable
                    retryable: true
                    details:
                      rate_limit_backend: redis
                      rate_limit_scope: read_lifecycle_routes
                runtime_unavailable:
                  value:
                    error_code: DEPENDENCY_UNAVAILABLE
                    message: runtime unavailable
                    retryable: true
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                  - error_code
                  - message
                  - retryable
                type: object
          description: Dependency unavailable
        default:
          content:
            application/problem+json:
              schema:
